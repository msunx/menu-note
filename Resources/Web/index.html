<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="styles.css">
    <title>Menu Note</title>
</head>
<body>
    <main class="editor-card">
        <header class="editor-meta">
            <span id="save-status" aria-live="polite"><i></i><span id="save-status-text">已保存</span></span>
            <div class="window-actions">
                <button class="meta-button" id="theme-button" type="button" aria-label="切换为浅色模式" title="切换外观">
                    <svg class="appearance-symbol" viewBox="0 0 20 20" aria-hidden="true">
                        <circle cx="10" cy="10" r="6.7"></circle>
                        <path class="symbol-fill" d="M10 3.3a6.7 6.7 0 0 1 0 13.4Z"></path>
                    </svg>
                </button>
                <button class="meta-button awake-button" id="awake-button" type="button" aria-label="保持 Mac 唤醒" aria-pressed="false" title="保持 Mac 唤醒（caffeinate）">
                    <svg class="awake-symbol" viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M3.4 7.2H13v3.5a4.8 4.8 0 0 1-9.6 0V7.2Z"></path>
                        <path d="M13 8.4h1.1a2.1 2.1 0 0 1 0 4.2h-1.9M2.7 17h13.6"></path>
                        <path class="symbol-steam" d="M6.1 4.9c-.9-.9.8-1.4.1-2.3M10 4.9c-.9-.9.8-1.4.1-2.3"></path>
                    </svg>
                </button>
                <button class="meta-button finder-button" id="finder-button" type="button" aria-label="管理 Finder 扩展" aria-pressed="false" title="管理 Finder 扩展">
                    <svg class="finder-symbol" viewBox="0 0 20 20" aria-hidden="true">
                        <rect x="3.1" y="2.7" width="13.8" height="14.6" rx="3.1"></rect>
                        <path d="M10.8 2.8c-.1 3.6-.7 6.3-1.8 8.2M6.1 12.6c1 1 2.3 1.5 3.9 1.5 1.5 0 2.8-.5 3.9-1.5"></path>
                        <circle class="finder-eye" cx="6.7" cy="7.6" r=".7"></circle>
                        <circle class="finder-eye" cx="13.3" cy="7.6" r=".7"></circle>
                    </svg>
                </button>
                <span class="window-action-separator" aria-hidden="true"></span>
                <button class="meta-button danger-on-hover" id="quit-button" type="button" aria-label="退出 Menu Note" title="退出 Menu Note">
                    <svg class="power-symbol" viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M10 2.6v6.8M5.2 5.6a6.2 6.2 0 1 0 9.6 0"></path>
                    </svg>
                </button>
            </div>
        </header>

        <section id="editor" class="editor" contenteditable="true" role="textbox" aria-label="富文本临时记事本" aria-multiline="true" data-placeholder="随手写点什么…" spellcheck="true"></section>

        <div id="link-popover" class="link-popover floating-popover" role="dialog" aria-label="添加链接" hidden>
            <input id="link-input" type="url" inputmode="url" placeholder="https://example.com" aria-label="链接地址">
            <button id="link-confirm" type="button">添加</button>
        </div>

        <div id="color-popover" class="color-popover floating-popover" role="menu" aria-label="文字颜色" hidden>
            <button type="button" data-color="default" aria-label="默认颜色" title="默认颜色"><span class="color-swatch color-default"></span></button>
            <button type="button" data-color="pink" aria-label="Pink" title="Pink"><span class="color-swatch color-pink"></span></button>
            <button type="button" data-color="mauve" aria-label="Mauve" title="Mauve"><span class="color-swatch color-mauve"></span></button>
            <button type="button" data-color="red" aria-label="Red" title="Red"><span class="color-swatch color-red"></span></button>
            <button type="button" data-color="peach" aria-label="Peach" title="Peach"><span class="color-swatch color-peach"></span></button>
            <button type="button" data-color="green" aria-label="Green" title="Green"><span class="color-swatch color-green"></span></button>
            <button type="button" data-color="blue" aria-label="Blue" title="Blue"><span class="color-swatch color-blue"></span></button>
            <button type="button" data-color="maroon" aria-label="Maroon" title="Maroon"><span class="color-swatch color-maroon"></span></button>
        </div>

        <nav class="toolbar" aria-label="富文本格式">
            <div class="toolbar-group" role="group" aria-label="文字样式">
                <button type="button" data-command="bold" aria-label="粗体" title="粗体（Command-B）"><strong>B</strong></button>
                <button type="button" data-command="italic" aria-label="斜体" title="斜体（Command-I）"><em>I</em></button>
                <button type="button" data-command="strikeThrough" aria-label="删除线" title="删除线"><span class="strike-glyph">S</span></button>
                <button type="button" data-command="code" aria-label="行内代码" title="行内代码"><span class="code-glyph">`</span></button>
                <button type="button" data-command="color" aria-label="文字颜色" aria-controls="color-popover" aria-expanded="false" title="文字颜色"><span class="color-glyph">A<i></i></span></button>
            </div>
            <div class="toolbar-group" role="group" aria-label="插入内容">
                <button type="button" data-command="link" aria-label="链接" aria-controls="link-popover" aria-expanded="false" title="链接（Command-K）">
                    <svg viewBox="0 0 18 18" aria-hidden="true">
                        <path d="m7.2 10.8 3.6-3.6M6.1 12.9l-1 .9a2.8 2.8 0 0 1-4-4l2.2-2.2a2.8 2.8 0 0 1 4 0M11.9 5.1l1-.9a2.8 2.8 0 0 1 4 4l-2.2 2.2a2.8 2.8 0 0 1-4 0"></path>
                    </svg>
                </button>
                <button type="button" data-command="quote" aria-label="引用" title="引用">
                    <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M5.2 5.2H2.8v3.2h2.5v3.4H2.5M13.2 5.2h-2.4v3.2h2.5v3.4h-2.8"></path></svg>
                </button>
            </div>
            <div class="toolbar-group" role="group" aria-label="列表">
                <button type="button" data-command="insertUnorderedList" aria-label="无序列表" title="无序列表">
                    <svg viewBox="0 0 18 18" aria-hidden="true">
                        <circle cx="3.5" cy="5" r=".8"></circle><circle cx="3.5" cy="9" r=".8"></circle><circle cx="3.5" cy="13" r=".8"></circle><path d="M7 5h8M7 9h8M7 13h8"></path>
                    </svg>
                </button>
                <button type="button" data-command="insertOrderedList" aria-label="编号列表" title="编号列表">
                    <svg viewBox="0 0 18 18" aria-hidden="true">
                        <path d="M7 5h8M7 9h8M7 13h8M2.5 4.2h1v2M2.3 8.2c.3-.4 1.4-.5 1.4.3 0 .6-1.4 1.6-1.4 1.6h1.5M2.3 12.2h1.4l-.9.8c1.3-.1 1.3 1.4-.5 1.1"></path>
                    </svg>
                </button>
                <button type="button" data-command="todo" aria-label="待办" title="待办">
                    <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="3"></rect><path d="m5.5 9 2.2 2.2 4.8-5"></path></svg>
                </button>
            </div>
        </nav>
    </main>

    <script src="app.js"></script>
</body>
</html>
