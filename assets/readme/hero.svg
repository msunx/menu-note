<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Menu Note — macOS 菜单栏富文本临时记事本</title>
  <desc id="desc">左侧展示项目名称和本地优先特性，右侧展示带待办和富文本工具栏的玻璃弹窗。</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181825"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <radialGradient id="lavenderGlow" cx="0" cy="0" r="1" gradientTransform="translate(1035 20) rotate(132) scale(420 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBA6F7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(710 374) rotate(-44) scale(460 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#89B4FA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="15" y1="10" x2="340" y2="305" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45475A" stop-opacity=".86"/>
      <stop offset=".5" stop-color="#313244" stop-opacity=".8"/>
      <stop offset="1" stop-color="#1E1E2E" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#89DCEB"/>
      <stop offset="1" stop-color="#89B4FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="32" fill="url(#background)"/>
  <rect width="1200" height="400" rx="32" fill="url(#lavenderGlow)"/>
  <rect width="1200" height="400" rx="32" fill="url(#blueGlow)"/>

  <g id="title-block" transform="translate(68 62)">
    <g id="app-mark">
      <rect width="86" height="86" rx="24" fill="#CDD6F4" fill-opacity=".1" stroke="#B4BEFE" stroke-opacity=".34"/>
      <rect x="19" y="17" width="20" height="34" rx="5" fill="#F38BA8"/>
      <rect x="35" y="12" width="23" height="39" rx="5" fill="#CBA6F7"/>
      <rect x="54" y="18" width="17" height="33" rx="5" fill="#A6E3A1"/>
      <rect x="11" y="35" width="64" height="43" rx="13" fill="url(#pocket)" stroke="#F5E0DC" stroke-opacity=".68"/>
      <path d="M20 47h25M20 58h18" stroke="#11111B" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>
      <circle cx="61" cy="62" r="9" fill="#F5E0DC"/>
      <path d="m57 62 3 3 6-7" fill="none" stroke="#1E1E2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="116" y="22" fill="#89B4FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MACOS MENU BAR · LOCAL-FIRST</text>
    <text x="116" y="86" fill="#CDD6F4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="68" font-weight="740">Menu Note</text>
    <text x="0" y="144" fill="#BAC2DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28">把临时记事、列表与待办，收进菜单栏。</text>
    <text x="0" y="183" fill="#9399B2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">一篇本地保存的富文本文档，打开即写，关闭即走。</text>

    <g transform="translate(0 224)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect width="132" height="38" rx="19" fill="#313244"/>
      <text x="66" y="25" fill="#B4BEFE" text-anchor="middle">macOS 14+</text>
      <rect x="144" width="178" height="38" rx="19" fill="#313244"/>
      <text x="233" y="25" fill="#89DCEB" text-anchor="middle">AppKit + WebKit</text>
      <rect x="334" width="130" height="38" rx="19" fill="#313244"/>
      <text x="399" y="25" fill="#A6E3A1" text-anchor="middle">LOCAL ONLY</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(786 36)">
    <rect x="8" y="34" width="350" height="316" rx="26" fill="#080812" fill-opacity=".45"/>
    <path d="M24 26H136L151 10c7-8 17-8 24 0l15 16h136c13 0 24 11 24 24v266c0 13-11 24-24 24H24C11 340 0 329 0 316V50c0-13 11-24 24-24Z"
          fill="url(#glass)" stroke="#B4BEFE" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="24" cy="54" r="4" fill="#A6E3A1"/>
    <text x="36" y="60" fill="#BAC2DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">已保存</text>
    <path d="M304 46a11 11 0 0 0 14 14 13 13 0 1 1-14-14Z" fill="none" stroke="#A6ADC8" stroke-width="2.5"/>
    <path d="M330 47h10v10M340 47l-13 13" fill="none" stroke="#A6ADC8" stroke-width="2.5" stroke-linecap="round"/>

    <text x="24" y="103" fill="#89B4FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="680">今天</text>
    <text x="74" y="103" fill="#CBA6F7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">把重要的事写下来</text>

    <g transform="translate(24 132)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">
      <rect width="18" height="18" rx="5" fill="#A6E3A1"/>
      <path d="m4 9 3 3 7-8" fill="none" stroke="#1E1E2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="15" fill="#7F849C" text-decoration="line-through">完成菜单栏编辑器</text>
      <rect y="36" width="18" height="18" rx="5" fill="none" stroke="#B4BEFE" stroke-opacity=".74" stroke-width="1.5"/>
      <text x="30" y="51" fill="#B4BEFE">记录下一件重要的事</text>
      <rect y="72" width="18" height="18" rx="5" fill="none" stroke="#B4BEFE" stroke-opacity=".74" stroke-width="1.5"/>
      <text x="30" y="87" fill="#A6E3A1">保持专注 ✨</text>
    </g>

    <rect y="279" width="350" height="61" fill="#11111B" fill-opacity=".58"/>
    <g transform="translate(22 315)" fill="#A6ADC8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">
      <text font-weight="700">B</text>
      <text x="45" font-family="Georgia, serif" font-style="italic">I</text>
      <text x="88" text-decoration="line-through">S</text>
      <text x="134" font-family="ui-monospace, Menlo, monospace">`</text>
      <text x="177" fill="#CDD6F4" text-decoration="underline" text-decoration-color="#CBA6F7">A</text>
      <path d="M223-8h18M232-17v18" stroke="#A6ADC8" stroke-width="2" stroke-linecap="round"/>
      <text x="266">☷</text>
      <rect x="307" y="-20" width="23" height="23" rx="6" fill="none" stroke="#A6ADC8" stroke-width="2"/>
      <path d="m312-8 5 5 9-12" fill="none" stroke="#A6ADC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
